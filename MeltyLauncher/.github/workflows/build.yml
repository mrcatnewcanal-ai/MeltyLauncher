
name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Mostrar archivos en la raiz del repo
      run: ls -la

    - name: Mostrar archivos dentro de MeltyLauncher
      run: |
        echo "=== Buscando carpeta MeltyLauncher ==="
        ls -la MeltyLauncher/ || ls -la meltylauncher/ || ls -la MELTYLAUNCHER/

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Grant execute permission and build APK
      run: |
        cd MeltyLauncher
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: MeltyLauncher/app/build/outputs/apk/debug/app-debug.apk
